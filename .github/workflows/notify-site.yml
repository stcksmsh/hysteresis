# Pings stcksmsh.github.io to rebuild whenever the package itself changes on
# master — the site depends on this repo as a git dependency
# (github:stcksmsh/sinteza-viz#master); its own `npm install`/`prepare`
# picks up the new commit and rebuilds via dist/. Mirrors
# docs/project-repo-example/.github/workflows/notify-site.yml in the site
# repo (that copy is for the io-page/devlog case; this one fires on the
# actual code branch instead).
name: notify site
on:
  push:
    branches: [master]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: dispatch rebuild
        run: |
          resp=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/stcksmsh/stcksmsh.github.io/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}')
          status="${resp##*$'\n'}"
          body="${resp%$'\n'*}"
          echo "HTTP $status"
          echo "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::dispatch failed (HTTP $status) — check SITE_DISPATCH_TOKEN is set on this repo"
            exit 1
          fi
# SITE_DISPATCH_TOKEN = a fine-grained PAT scoped to just stcksmsh.github.io
# with ONLY "Actions: Read and write" permission (not Contents) -- that's the
# minimum GitHub allows for triggering a workflow_dispatch run. Store it as
# a secret in THIS repo (Settings -> Secrets and variables -> Actions). Not
# set up yet as of this commit — this workflow will fail loudly (not
# silently) until it is.
